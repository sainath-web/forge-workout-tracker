<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101210">
  <meta name="description" content="A free, private workout tracker for routines, strength progress, and training history.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Forge — Workout Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Forge home"><span class="brand-mark">F</span><span>forge<span class="brand-dot">.</span></span></a>
      <div class="side-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-view="workouts"><span class="nav-icon">▤</span>Workouts</button>
        <button class="nav-item" data-view="routines"><span class="nav-icon">▦</span>Routines</button>
        <button class="nav-item" data-view="progress"><span class="nav-icon">↗</span>Progress</button>
        <button class="nav-item" data-view="exercises"><span class="nav-icon">▶</span>Exercises</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="free-card"><div class="free-glyph">✳</div><strong>Your training, your data.</strong><p id="storage-summary">Free to use. Saved privately on this device.</p><button id="export-data" class="text-button">Export your data <span>↗</span></button></div>
        <div class="profile"><div class="avatar" id="profile-avatar">Y</div><div><strong id="profile-name">Your profile</strong><small id="profile-email">Local account</small></div><button class="more-button" id="profile-menu" aria-label="Account options">···</button></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar"><div class="crumb"><span>Workspace</span><b>/</b><strong id="page-name">Overview</strong></div><div class="topbar-actions"><span class="today-label" id="today-label"></span><button class="secondary-button install-button" id="install-app" hidden>Install app</button><button class="secondary-button" id="account-button">Sign in to sync</button><button class="icon-button" id="settings-button" title="Settings">⚙</button></div></header>
      <div id="page-content"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow" id="modal-kicker">NEW WORKOUT</div><h2 id="modal-title">Start a workout</h2></div><button class="close-button" id="modal-close" aria-label="Close">×</button></div><div id="modal-body"></div></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
